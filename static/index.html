<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVE Intel</title>
<style>
  body {
    background-color: #0d0d0f;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    text-align: center;
    padding: 40px 20px 20px 20px;
  }
  h1 {
    font-size: 28px;
    margin: 0;
    color: #f2f2f2;
  }
  .subtitle {
    color: #888;
    margin-top: 6px;
    font-size: 14px;
  }
  .search-box {
    display: flex;
    gap: 8px;
    width: 90%;
    max-width: 500px;
    margin-top: 24px;
  }
  input {
    flex: 1;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background-color: #1a1a1d;
    color: #fff;
    font-size: 16px;
  }
  button {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background-color: #4f46e5;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  button:hover {
    background-color: #4338ca;
  }
  #result {
    width: 95%;
    max-width: 1000px;
    margin-top: 30px;
    display: none;
  }
  .card {
    background-color: #1a1a1d;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid #2a2a2e;
    font-size: 14px;
  }
  .row:last-child {
    border-bottom: none;
  }
  .label {
    color: #999;
  }
  .sublabel {
    color: #666;
    font-size: 12px;
    display: block;
  }
  .value {
    color: #fff;
    font-weight: 500;
    text-align: right;
  }
  .char-name-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .char-name {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
  }
  .zkill-link {
    color: #4f46e5;
    font-size: 13px;
    text-decoration: none;
  }
  .zkill-link:hover {
    text-decoration: underline;
  }
  .fleetmate-link {
    color: inherit;
    text-decoration: none;
  }
  .fleetmate-link:hover .fleetmate-name {
    text-decoration: underline;
  }
  .card-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    cursor: pointer;
    list-style: none;
  }
  .card-title::-webkit-details-marker {
    display: none;
  }
  .card-title::before {
    content: "▸ ";
    display: inline-block;
    transition: transform 0.15s ease;
  }
  details[open] > .card-title::before {
    content: "▾ ";
  }
  .card-body {
    margin-top: 10px;
  }
  .flag-banner {
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .flag-danger {
    background-color: #3d1a1a;
    color: #ff8080;
    border: 1px solid #5c2626;
  }
  .flag-ok {
    background-color: #1a2e1a;
    color: #8fd98f;
    border: 1px solid #2d4d2d;
  }
  .flag-neutral {
    background-color: #2a2a1a;
    color: #d9c98f;
    border: 1px solid #4d4526;
  }
  #loading {
    margin-top: 20px;
    color: #888;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>EVE Intel</h1>
  <div class="subtitle">Character lookup for New Eden</div>
</header>

<div class="search-box">
  <input type="text" id="nameInput" placeholder="Enter character name...">
  <button onclick="searchCharacter()">Search</button>
</div>

<div id="loading">Searching...</div>

<div id="result"></div>

<script>
function buildListRows(items) {
  if (!items || items.length === 0) {
    return '<div class="row"><span class="value">No data available</span></div>';
  }
  var rows = '';
  for (var i = 0; i < items.length; i++) {
    var item = items[i];
    var nameBlock = '<span class="fleetmate-name">' + (item.name || 'Unknown') + '</span>';
    if (item.corporation_name) {
      nameBlock += '<span class="sublabel">' + item.corporation_name + '</span>';
    }
    var label = nameBlock;
    if (item.character_id) {
      label = '<a class="fleetmate-link" href="https://zkillboard.com/character/' + item.character_id + '/" target="_blank">' + nameBlock + '</a>';
    }
    rows += '<div class="row"><span class="label">' + label + '</span><span class="value">' + item.kills + ' kills</span></div>';
  }
  return rows;
}

function buildEmploymentRows(history) {
  if (!history || history.length === 0) {
    return '<div class="row"><span class="value">No data available</span></div>';
  }
  var rows = '';
  for (var i = 0; i < history.length; i++) {
    var entry = history[i];
    var durationText = (entry.duration_days !== null && entry.duration_days !== undefined) ? (entry.duration_days + ' days') : 'Unknown';
    var startDate = entry.start_date ? entry.start_date.split('T')[0] : '';
    rows += '<div class="row"><span class="label">' + entry.corporation_name + (entry.is_deleted ? ' (defunct)' : '') +
      '<span class="sublabel">' + startDate + ' \u2192 ' + entry.end_date + '</span></span>' +
      '<span class="value">' + durationText + '</span></div>';
  }
  return rows;
}

function buildCorpHopBanner(analysis) {
  if (!analysis) return '';
  var flagClass = 'flag-ok';
  if (analysis.is_flagged) {
    flagClass = 'flag-danger';
  } else if (analysis.short_stint_count > 0) {
    flagClass = 'flag-neutral';
  }
  return '<div class="flag-banner ' + flagClass + '">' + analysis.reason + '</div>';
}

async function searchCharacter() {
  var name = document.getElementById('nameInput').value.trim();
  if (!name) return;

  var resultDiv = document.getElementById('result');
  var loadingDiv = document.getElementById('loading');
  resultDiv.style.display = 'none';
  loadingDiv.style.display = 'block';

  try {
    var response = await fetch('/api/character/' + encodeURIComponent(name));
    var data = await response.json();

    loadingDiv.style.display = 'none';
    resultDiv.style.display = 'block';

    if (data.error) {
      resultDiv.innerHTML = '<div class="card"><div class="row"><span class="value">' + data.error + '</span></div></div>';
      return;
    }

    var zk = data.zkillboard || {};

    var mainCard = '<div class="card">' +
      '<div class="char-name-row">' +
        '<div class="char-name">' + data.name + '</div>' +
        '<a class="zkill-link" href="' + data.zkillboard_url + '" target="_blank">View on zKillboard \u2192</a>' +
      '</div>' +
      '<div class="row"><span class="label">Corporation</span><span class="value">' + (data.corporation_name || '\u2014') + '</span></div>' +
      '<div class="row"><span class="label">Alliance</span><span class="value">' + (data.alliance_name || '\u2014') + '</span></div>' +
      '<div class="row"><span class="label">Security Status</span><span class="value">' + (data.security_status ?? '\u2014') + '</span></div>' +
      '<div class="row"><span class="label">Ships Destroyed</span><span class="value">' + (zk.ships_destroyed ?? '\u2014') + '</span></div>' +
      '<div class="row"><span class="label">Ships Lost</span><span class="value">' + (zk.ships_lost ?? '\u2014') + '</span></div>' +
      '<div class="row"><span class="label">ISK Destroyed</span><span class="value">' + (zk.isk_destroyed ? Math.round(zk.isk_destroyed).toLocaleString() : '\u2014') + '</span></div>' +
      '<div class="row"><span class="label">Danger Ratio</span><span class="value">' + (zk.danger_ratio ?? '\u2014') + '</span></div>' +
    '</div>';

    var gridCards = '<div class="grid-cards">' +

      '<details class="card" open>' +
        '<summary class="card-title">Employment History &amp; Corp-Hopping Check</summary>' +
        '<div class="card-body">' +
          buildCorpHopBanner(data.corp_hop_analysis) +
          buildEmploymentRows(data.employment_history) +
        '</div>' +
      '</details>' +

      '<details class="card" open>' +
        '<summary class="card-title">Preferred Ships (Recent Activity)</summary>' +
        '<div class="card-body">' + buildListRows(data.top_ships) + '</div>' +
      '</details>' +

      '<details class="card" open>' +
        '<summary class="card-title">Frequently Flies With \u2014 Alliances (Recent Activity)</summary>' +
        '<div class="card-body">' + buildListRows(data.flies_with_alliances) + '</div>' +
      '</details>' +

      '<details class="card" open>' +
        '<summary class="card-title">Frequently Flies With \u2014 Corporations (Recent Activity)</summary>' +
        '<div class="card-body">' + buildListRows(data.flies_with_corporations) + '</div>' +
      '</details>' +

      '<details class="card">' +
        '<summary class="card-title">Frequently Flies With \u2014 Characters (Recent Activity)</summary>' +
        '<div class="card-body">' + buildListRows(data.flies_with_characters) + '</div>' +
      '</details>' +

    '</div>';

    resultDiv.innerHTML = mainCard + gridCards;
  } catch (err) {
    loadingDiv.style.display = 'none';
    resultDiv.style.display = 'block';
    resultDiv.innerHTML = '<div class="card"><div class="row"><span class="value">Something went wrong. Please try again.</span></div></div>';
  }
}

document.getElementById('nameInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') {
    searchCharacter();
  }
});
</script>

</body>
</html>
