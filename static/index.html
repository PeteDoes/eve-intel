<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVE Intel</title>
<style>
  body {
    background-color: #0d0d0f;
    color: #e6e6e6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 0 0 60px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  header {
    width: 100%;
    text-align: center;
    padding: 40px 20px 10px 20px;
  }
  h1 {
    font-size: 28px;
    margin: 0;
    color: #f2f2f2;
  }
  .subtitle {
    color: #888;
    margin-top: 6px;
    font-size: 14px;
  }
  .mode-tabs {
    display: flex;
    gap: 8px;
    margin-top: 20px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .mode-tab {
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid #333;
    background-color: #1a1a1d;
    color: #aaa;
    font-size: 14px;
    cursor: pointer;
  }
  .mode-tab:hover {
    background-color: #222226;
  }
  .mode-tab.active {
    background-color: #4f46e5;
    border-color: #4f46e5;
    color: #fff;
  }
  .search-box {
    display: flex;
    gap: 8px;
    width: 90%;
    max-width: 600px;
    margin-top: 24px;
    flex-wrap: wrap;
  }
  input[type="text"], input[type="date"] {
    flex: 1;
    min-width: 160px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background-color: #1a1a1d;
    color: #fff;
    font-size: 16px;
  }
  input[type="date"] {
    flex: 0 0 auto;
    color-scheme: dark;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
    min-height: 180px;
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #333;
    background-color: #1a1a1d;
    color: #fff;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
  }
  button.action {
    padding: 12px 20px;
    border-radius: 8px;
    border: none;
    background-color: #4f46e5;
    color: white;
    font-size: 16px;
    cursor: pointer;
  }
  button.action:hover {
    background-color: #4338ca;
  }
  .result-area {
    width: 95%;
    max-width: 1000px;
    margin-top: 30px;
    display: none;
  }
  .card {
    background-color: #1a1a1d;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .grid-cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 16px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid #2a2a2e;
    font-size: 14px;
    gap: 12px;
  }
  .row:last-child {
    border-bottom: none;
  }
  .label {
    color: #999;
  }
  .sublabel {
    color: #666;
    font-size: 12px;
    display: block;
  }
  .stint-note {
    color: #d9c98f;
  }
  .value {
    color: #fff;
    font-weight: 500;
    text-align: right;
    white-space: nowrap;
  }
  .char-name-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .char-name {
    font-size: 20px;
    font-weight: 600;
    color: #fff;
  }
  .zkill-link {
    color: #4f46e5;
    font-size: 13px;
    text-decoration: none;
  }
  .zkill-link:hover {
    text-decoration: underline;
  }
  .fleetmate-link {
    color: inherit;
    text-decoration: none;
  }
  .fleetmate-link:hover .fleetmate-name {
    text-decoration: underline;
  }
  .card-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: #888;
    cursor: pointer;
    list-style: none;
  }
  .card-title::-webkit-details-marker {
    display: none;
  }
  .card-title::before {
    content: "\25B8  ";
    display: inline-block;
  }
  details[open] > .card-title::before {
    content: "\25BE  ";
  }
  .card-body {
    margin-top: 10px;
  }
  .flag-banner {
    padding: 12px 14px;
    border-radius: 8px;
    font-size: 13px;
    margin-bottom: 12px;
    font-weight: 500;
  }
  .flag-danger {
    background-color: #3d1a1a;
    color: #ff8080;
    border: 1px solid #5c2626;
  }
  .flag-ok {
    background-color: #1a2e1a;
    color: #8fd98f;
    border: 1px solid #2d4d2d;
  }
  .flag-neutral {
    background-color: #2a2a1a;
    color: #d9c98f;
    border: 1px solid #4d4526;
  }
  .summary-line {
    font-size: 14px;
    color: #ccc;
    margin-bottom: 4px;
  }
  .loss-num {
    color: #ff8080;
  }
  .kill-num {
    color: #8fd98f;
  }
  .warn-num {
    color: #d9c98f;
  }
  .loading-text {
    margin-top: 20px;
    color: #888;
    display: none;
    text-align: center;
    padding: 0 20px;
  }
  .hint {
    color: #666;
    font-size: 12px;
    width: 90%;
    max-width: 600px;
    margin-top: 8px;
  }
  .bulk-box {
    width: 90%;
    max-width: 600px;
    margin-top: 24px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bulk-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    align-items: center;
  }
  .check-label {
    font-size: 14px;
    color: #ccc;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .not-found-list {
    font-size: 13px;
    color: #aaa;
    line-height: 1.7;
    word-break: break-word;
  }

  /* Expandable pilot rows in Bulk Check */
  details.pilot {
    border-bottom: 1px solid #2a2a2e;
  }
  details.pilot:last-child {
    border-bottom: none;
  }
  summary.pilot-summary {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 9px 0;
    cursor: pointer;
    list-style: none;
    font-size: 14px;
  }
  summary.pilot-summary::-webkit-details-marker {
    display: none;
  }
  summary.pilot-summary:hover .fleetmate-name {
    text-decoration: underline;
  }
  .pilot-main::before {
    content: "\25B8  ";
    color: #666;
  }
  details.pilot[open] .pilot-main::before {
    content: "\25BE  ";
  }
  .pilot-main {
    color: #ddd;
  }
  .pilot-main .sublabel {
    margin-left: 16px;
  }
  .pilot-badge {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    white-space: nowrap;
    font-weight: 600;
  }
  .badge-danger {
    background-color: #3d1a1a;
    color: #ff8080;
    border: 1px solid #5c2626;
  }
  .badge-warn {
    background-color: #2a2a1a;
    color: #d9c98f;
    border: 1px solid #4d4526;
  }
  .badge-calm {
    background-color: #222226;
    color: #999;
    border: 1px solid #333;
  }
  .pilot-body {
    padding: 4px 0 14px 16px;
  }
  .pilot-body .zkill-link {
    display: inline-block;
    margin-bottom: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>EVE Intel</h1>
  <div class="subtitle">Character lookup for New Eden</div>
</header>

<div class="mode-tabs">
  <button class="mode-tab active" id="tabChar" onclick="showMode('char')">Character Lookup</button>
  <button class="mode-tab" id="tabCorp" onclick="showMode('corp')">Corp Activity Report</button>
  <button class="mode-tab" id="tabBulk" onclick="showMode('bulk')">Bulk Check</button>
</div>

<!-- CHARACTER LOOKUP -->
<div id="charSection" style="display:flex; flex-direction:column; align-items:center; width:100%;">
  <div class="search-box">
    <input type="text" id="nameInput" placeholder="Enter character name...">
    <button class="action" onclick="searchCharacter()">Search</button>
  </div>
  <div class="loading-text" id="loading">Searching...</div>
  <div class="result-area" id="result"></div>
</div>

<!-- CORP ACTIVITY REPORT -->
<div id="corpSection" style="display:none; flex-direction:column; align-items:center; width:100%;">
  <div class="search-box">
    <input type="text" id="corpInput" placeholder="Enter corporation name...">
    <input type="date" id="sinceInput">
    <button class="action" onclick="runCorpReport()">Run Report</button>
  </div>
  <div class="hint">Lists every pilot in the corp who lost ships or got kills since the start date. Scans up to 600 of the corp's most recent losses and 600 of its most recent kills.</div>
  <div class="loading-text" id="corpLoading">Scanning killmails... this can take 30 to 60 seconds for busy corps.</div>
  <div class="result-area" id="corpResult"></div>
</div>

<!-- BULK CHECK -->
<div id="bulkSection" style="display:none; flex-direction:column; align-items:center; width:100%;">
  <div class="bulk-box">
    <textarea id="bulkNames" placeholder="Paste character names here, one per line (up to 1000)..."></textarea>
    <div class="bulk-row">
      <input type="text" id="bulkCorp" placeholder="Corporation to check for (optional)...">
      <input type="text" id="bulkAlliance" placeholder="Alliance
